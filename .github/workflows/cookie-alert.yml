name: 네이버 쿠키 만료 알람

on:
  schedule:
    # 매주 월요일 오전 9시 KST (= UTC 월요일 00:00)
    - cron: '0 0 * * 1'
  workflow_dispatch:   # 수동 테스트용

jobs:
  check-cookie:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 만료 감지 실행
        env:
          NAVER_COOKIES_JSON: ${{ secrets.NAVER_COOKIES_JSON }}
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/check_cookie_expiry.py
