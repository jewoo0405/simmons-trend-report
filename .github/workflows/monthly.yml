name: 월간 브랜드 트렌드 보고서

on:
  schedule:
    - cron: '0 0 1 * *'   # 매월 1일 오전 9시 (KST = UTC+9, 즉 UTC 00:00)
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: 보고서 생성
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_COOKIES_JSON: ${{ secrets.NAVER_COOKIES_JSON }}
        run: python main.py

      - name: 결과 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ index.html
          git diff --staged --quiet || git commit -m "보고서 자동 생성: $(date +'%Y년 %m월')"
          git push

      - name: Netlify 배포
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 1f821db1-3c3c-4a27-b8e6-31c0d2d5adbd
        run: npx netlify-cli deploy --dir=. --prod
